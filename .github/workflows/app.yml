name: App checks

# Run for every change: root configuration, tools and native plugins can affect
# the app just as directly as src/, modules/, contracts/ and resources/.
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install locked dependencies and apply camera patch
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Test
        run: bun run test --ci --runInBand
      - name: Export Android and iOS JavaScript
        if: runner.os == 'Linux'
        run: bunx --no-install expo export --platform android --platform ios
