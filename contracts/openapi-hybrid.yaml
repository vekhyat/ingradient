x-draft-client-policy:
  analysisFallbackStartMs: 2000
  offlineOrExplicitBackendFailure: immediate local fallback
  lateBackendAfterLocalDisplay: validate inputDigest, editions and active scan revision at apply time, then offer explicit
    update; never silent replacement
  warmupPing: GET /health with no body on each entry to the scan screen, at most once per 10 minutes; no repeating timer while
    the screen stays open
  personalData: local only
  platformTransientResponse: 'A response that is not contract JSON (HTML loading page, non-JSON body, or 502/504 from the
    platform) is a wake-up signal, not a D69 failure: the local result proceeds and the client may re-send the identical request
    once within the remaining lifetime. This is the only permitted re-send.'
  foregroundOnly: Leaving the foreground cancels the request; a cancelled scan never receives an offer. The offer exists only
    while that scan result is on screen.
x-draft-operating-limits:
  maxRequestBytes: 262144
  automaticAnalysisRetries: 0
  analysisRequestLifetimeMs: 90000
  analysisRequestLifetimeNote: Initial budget covering one documented Render Free spin-up (about one minute) plus a Neon resume
    margin. BE-14 measures it; a different value needs a recorded decision and a re-freeze, and HYB-01 reads it from contracts/.
  rateLimit:
    scope: POST /v1/analyses only
    perClientAddressPerMinute: 60
    burst: 20
    globalPerHour: 1800
    key: client address appended by Render's proxy (rightmost X-Forwarded-For entry); never a client-supplied hop; held in
      memory only, never stored or logged
    limitation: Counters reset when the free service spins down, so this blunts bursts but does not cap monthly usage.
  learningCollectionReleased: false
  namedTimers:
    ANALYSIS_FALLBACK_START_MS: D69, 2000, from analysis request send after local OCR
    ANALYSIS_REQUEST_LIFETIME_MS: D104, 90000 initial, from the same send; changed only by decision and re-freeze
    OFF_LOOKUP_TIMEOUT_MS: barcode lookup to Open Food Facts; defined in 06-api.md, separate operation
    PHOTO_TO_GRADE_TARGET_MS: BRIEF aspiration, not a timer; measured in QA-01
  description: Engineering defaults within accepted decisions, not a measured SLA.
x-runtime-invariants:
- No account/device/profile/behaviour identifiers in the learning dataset.
- No image/crop/coordinates/arbitrary URL forwarding in AnalyzeRequest.
- Reject stale/cancelled/input-revised completions on client, including candidates.
- Validate source/citation references, units/basis, method eligibility, versions and scientific snapshot identity.
- Do not include local personal outcomes in backend DTOs.
- Terms acceptance is not an automatic legal-basis conclusion; collection stays off pending actual release.
- 90-day originals and annual-reviewed useful curated examples require real deletion/review/lineage operations.
- 'Graded score within its route bound: general and fats/nuts/seeds -17..55, beverage -18..54.'
- Every ScientificReason.citationIds entry resolves to an entry in citations.
- Rate-limit, 413 and body-size checks run before the body is parsed, logged or stored.
- With collection off, POST /v1/analyses performs no database access.
- Client source ids are per-request labels (src-N); the server assigns its own record ids.
- Source ids are unique within one request; duplicates are rejected with 400.
- GET /health never touches the database and answers within 5 seconds.
- Original-submission expiry runs only while collection is on, after an analysis response is sent; never on GET /health.
- A learning row is written only after the full response was sent while the client was still connected.
- A graded result is offered only if scientific.method.bundleSha256 equals the request methodBundleSha256.
- The phone renders reason text from its own reviewed template for templateId; an unknown templateId drops that reason with
  an issue.
- scoringFacts and request category are optional; omission means every fact is unknown, never absent or general (ADR013, D146).
- Every scoringFacts source id names a sourceRef of the same product; a request with a dangling id is rejected with 400 and
  a response with one is not offered.
- A known category needs nonempty categorySourceIds before a new calculation treats it as supported; a missing source tag
  never proves an exception absent.
